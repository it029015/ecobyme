  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1712;
      --bg-2: #13241a;
      --card: #172219;
      --text: #e6f1e8;
      --muted: #9db3a3;
      --accent: #4cc275;
      --accent-2: #2f8f4e;
      --accent-ink: #08140c;
      --border: rgba(230, 241, 232, .10);
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1712; --bg-2: #13241a; --card: #172219; --text: #e6f1e8; --muted: #9db3a3;
    --accent: #4cc275; --accent-2: #2f8f4e; --accent-ink: #08140c;
    --border: rgba(230, 241, 232, .10); --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: radial-gradient(1200px 600px at 80% -10%, var(--bg-2), transparent 60%), var(--bg);
    line-height: 1.55;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

  /* Barra lingue */
  .topbar { display: flex; justify-content: flex-end; padding-top: 16px; }
  .lang {
    position: relative; display: inline-flex; align-items: center; gap: 6px;
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 12px; box-shadow: var(--shadow);
  }
  .lang svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
  .lang select {
    appearance: none; -webkit-appearance: none; border: 0; background: transparent;
    font: inherit; font-size: 15px; color: var(--text); padding-right: 14px; cursor: pointer;
  }
  .lang::after {
    content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: translateY(-70%) rotate(45deg); pointer-events: none;
  }

  /* Hero */
  .hero { text-align: center; padding: 40px 0 28px; }
  .icon {
    width: 112px; height: 112px; border-radius: 26px; box-shadow: var(--shadow);
    display: block; margin: 0 auto 20px;
  }
  h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1.1; margin: 0 0 10px; letter-spacing: -.02em; }
  .tagline { font-size: clamp(17px, 3.2vw, 20px); color: var(--muted); margin: 0 auto; max-width: 560px; }

  /* Card contatto */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 22px;
    box-shadow: var(--shadow); padding: 28px 24px; margin: 8px 0 24px;
  }
  .contact { text-align: center; }
  .contact h2 { margin: 0 0 8px; font-size: 24px; }
  .contact p { margin: 0 auto 20px; color: var(--muted); max-width: 520px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: var(--accent-ink); text-decoration: none; font-weight: 600; font-size: 17px;
    border: 0; border-radius: 14px; padding: 15px 26px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(47, 143, 78, .30); transition: transform .15s ease;
    width: 100%; max-width: 360px;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .email-row {
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px;
    margin-top: 16px; font-size: 15px; color: var(--muted);
  }
  .email-row code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px;
    word-break: break-all;
  }
  .copy {
    font: inherit; font-size: 14px; color: var(--accent); background: transparent;
    border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; cursor: pointer;
  }
  .response { margin-top: 18px; font-size: 14px; color: var(--muted); }

  /* Sezioni */
  h3 { font-size: 20px; margin: 0 0 14px; }
  .tips { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .tips li { display: flex; gap: 12px; align-items: flex-start; }
  .tips .dot {
    flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    background: var(--bg-2); color: var(--accent); font-size: 14px; font-weight: 700;
  }
  details { border-top: 1px solid var(--border); padding: 14px 0; }
  details:first-of-type { border-top: 0; padding-top: 0; }
  summary {
    cursor: pointer; font-weight: 600; list-style: none; display: flex;
    justify-content: space-between; gap: 12px; align-items: center;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; color: var(--accent); font-size: 22px; line-height: 1; transition: transform .2s; }
  details[open] summary::after { transform: rotate(45deg); }
  details p { margin: 10px 0 0; color: var(--muted); }

  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 12px 0 40px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px;
    font-size: 14px; transition: all .25s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

  function detectLang() {
    const fromUrl = new URLSearchParams(location.search).get("lang");
    if (fromUrl && T[fromUrl]) return fromUrl;
    try { const saved = localStorage.getItem("ecobyme-lang"); if (saved && T[saved]) return saved; } catch (e) {}
    for (const tag of (navigator.languages || [navigator.language || "en"])) {
      const code = tag.toLowerCase().split("-")[0];
      if (code === "zh") return "zh-Hans";
      if (T[code]) return code;
    }
    return "en";
  }

  function apply(lang) {
    const s = T[lang];
    document.documentElement.lang = lang;
    document.title = s.pageTitle;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = s[el.dataset.i18n]; });
    document.getElementById("footer").textContent = s.footer.replace("{y}", new Date().getFullYear());
    document.getElementById("mailBtn").href =
      "mailto:" + SUPPORT_EMAIL +
      "?subject=" + encodeURIComponent(s.mailSubject) +
      "&body=" + encodeURIComponent(s.mailBody);
    document.getElementById("lang").value = lang;
    try { localStorage.setItem("ecobyme-lang", lang); } catch (e) {}
  }

  const select = document.getElementById("lang");
  LANGS.forEach(([code, name]) => select.add(new Option(name, code)));
  select.addEventListener("change", e => apply(e.target.value));
  document.getElementById("emailText").textContent = SUPPORT_EMAIL;

  const toast = document.getElementById("toast");
  document.getElementById("copyBtn").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(SUPPORT_EMAIL); } catch (e) {
      const r = document.createRange(); r.selectNodeContents(document.getElementById("emailText"));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    }
    toast.textContent = T[select.value].copied;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1800);
  });

  apply(detectLang());
</script>
</body>
</html>
